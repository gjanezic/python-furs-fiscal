[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "furs_fiscal"
version = "2.0.0"
description = "Typed Python client for the Slovenian FURS v3.2 fiscal-verification web service."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["FURS", "fiscal", "fiscal register", "davcne blagajne", "Slovenia", "eDavki"]
authors = [
    { name = "Boris Savic", email = "boris70@gmail.com" },
]
maintainers = [
    { name = "Gregor Janezic" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=41.0",
    "PyJWT>=2.8",
    "httpx>=0.25",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "jsonschema>=4.0",
    "hypothesis>=6.0",
]

[project.urls]
Homepage = "https://github.com/boris-savic/python_furs_fiscal"
Specification = "https://www.datoteke.fu.gov.si/dpr/files/TehnicnaDokumentacijaVer3.2.pdf"

[tool.hatch.build.targets.wheel]
packages = ["furs_fiscal"]

[tool.hatch.build.targets.sdist]
include = [
    "furs_fiscal/**",
    "tests/**",
    "specs/schemas/**",
    "specs/examples/**",
    "specs/README.md",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
